name: Verify VPS Control Plane

on:
  push:
    branches:
      - "ops/self-hosted-runner-bootstrap-001"
    paths:
      - ".github/workflows/vps-control-plane-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify runner and Desktop Commander state
        shell: bash
        run: |
          set -euo pipefail
          DC_SERVICE="desktop-commander-remote.service"
          RUNNER_SERVICE="$(systemctl list-unit-files --type=service --no-legend | awk '/^actions\.runner\.martaxi-boss-lowcost-europa\./ {print $1; exit}')"

          test -n "$RUNNER_SERVICE"

          RUNNER_ACTIVE="$(systemctl is-active "$RUNNER_SERVICE" || true)"
          RUNNER_ENABLED="$(systemctl is-enabled "$RUNNER_SERVICE" || true)"
          DC_ACTIVE="$(systemctl is-active "$DC_SERVICE" || true)"
          DC_ENABLED="$(systemctl is-enabled "$DC_SERVICE" || true)"

          echo "RUNNER_SERVICE=$RUNNER_SERVICE"
          echo "RUNNER_ACTIVE=$RUNNER_ACTIVE"
          echo "RUNNER_ENABLED=$RUNNER_ENABLED"
          echo "DC_ACTIVE=$DC_ACTIVE"
          echo "DC_ENABLED=$DC_ENABLED"

          test "$RUNNER_ACTIVE" = "active"
          test "$RUNNER_ENABLED" = "enabled"
          test "$DC_ACTIVE" = "inactive"
          test "$DC_ENABLED" = "disabled"

          if ps -eo args | grep -F '@wonderwhy-er/desktop-commander' | grep -v grep >/dev/null; then
            echo "DC_PROCESS_REMAINS"
            exit 1
          fi

          echo "CONTROL_PLANE_VERIFY=PASS"
