name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lowcost_europa_ci
          POSTGRES_USER: lowcost_europa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lowcost_europa_ci -d lowcost_europa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lowcost_europa_ci
      POSTGRES_USER: lowcost_europa_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Django check
        run: python manage.py check
      - name: Production deploy check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-deploy-check-only-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '3600'
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'
        run: python manage.py check --deploy
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Ruff
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product image script syntax
        run: node --check apps/storefront/static/storefront/product-images.js
      - name: Product image regression tests
        run: node --test tests/js/product-images.test.cjs
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test
      - name: Temporary pilot HTTP read-only check (no deployment)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 152
        continue-on-error: true
        shell: bash
        run: |
          set -u
          base="https://lowcost-europa.duckdns.org"
          for path in / /robots.txt /health/live/ /health/ready/; do
            status="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --retry 0 --dump-header "$RUNNER_TEMP/lce-headers" --output "$RUNNER_TEMP/lce-body" --write-out '%{http_code}' "$base$path")" || status="000"
            echo "PILOT_READONLY_HTTP path=$path code=$status"
            if grep -qi '^x-robots-tag:' "$RUNNER_TEMP/lce-headers" 2>/dev/null; then
              grep -i '^x-robots-tag:' "$RUNNER_TEMP/lce-headers" | head -1
            else
              echo "PILOT_X_ROBOTS_HEADER=missing path=$path"
            fi
            if [ "$path" = "/" ]; then
              if grep -Eiq '<meta[^>]+name="robots"[^>]+content="noindex' "$RUNNER_TEMP/lce-body"; then
                echo "PILOT_META_ROBOTS_NOINDEX=yes"
              else
                echo "PILOT_META_ROBOTS_NOINDEX=not_observed"
              fi
              if grep -q 'product-images.js' "$RUNNER_TEMP/lce-body"; then
                echo "PILOT_NEW_IMAGE_SCRIPT_PRESENT=yes"
              else
                echo "PILOT_NEW_IMAGE_SCRIPT_PRESENT=no"
              fi
            fi
            if [ "$path" = "/robots.txt" ]; then
              grep -E '^(User-agent:|Disallow:)' "$RUNNER_TEMP/lce-body" | head -5 || true
            fi
          done
          for family in cavitacao-rf-vacuum-corpo hydrodermoabrasao-aqua-facial-multifuncoes pressoterapia-vacuum-drenagem hifu diodo-laser-remocao-tatuagens-pigmentacao; do
            status="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --retry 0 --output /dev/null --write-out '%{http_code}' "$base/products/$family/")" || status="000"
            echo "PILOT_FAMILY_READONLY slug=$family code=$status"
          done
          status="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --retry 0 --output /dev/null --write-out '%{http_code}' "$base/painel/")" || status="000"
          echo "PILOT_PRIVATE_OWNER_ENTRY code=$status"
