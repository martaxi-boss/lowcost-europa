name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lowcost_europa_ci
          POSTGRES_USER: lowcost_europa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lowcost_europa_ci -d lowcost_europa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lowcost_europa_ci
      POSTGRES_USER: lowcost_europa_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Reject tracked runtime and browser QA residue
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked_dirs = {
              "node_modules", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".ruff_cache", "qa-artifacts", "test-results", "playwright-report",
              "staticfiles", "coverage", ".npm"
          }
          blocked_names = {".DS_Store", "Thumbs.db"}
          invalid = [
              name for name in tracked if name and (
                  any(part in blocked_dirs for part in PurePosixPath(name).parts)
                  or PurePosixPath(name).name in blocked_names
                  or name.endswith((".pyc", ".pyo", ".swp", ".swo", ".tmp", ".log"))
              )
          ]
          if invalid:
              raise SystemExit("Tracked generated files: " + ", ".join(invalid))
          print(f"GIT_HYGIENE_PASS tracked_files={len(tracked) - 1}")
          PY
      - name: Django check
        run: python manage.py check
      - name: Production deploy check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-deploy-check-only-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '3600'
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'
        run: python manage.py check --deploy
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Ruff
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product image script syntax
        run: node --check apps/storefront/static/storefront/product-images.js
      - name: Product image regression tests
        run: node --test tests/js/product-images.test.cjs
      - name: Catalog explorer JavaScript syntax
        run: node --check apps/storefront/static/storefront/catalog-explorer.js
      - name: Catalog explorer unit tests
        run: node --test tests/js/catalog-explorer.test.cjs
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test
