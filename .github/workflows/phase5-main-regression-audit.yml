name: Phase 5 Main Regression Audit

on:
  push:
    branches:
      - builder/phase5-full-regression-001

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lowcost_europa_ci
          POSTGRES_USER: lowcost_europa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lowcost_europa_ci -d lowcost_europa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lowcost_europa_ci
      POSTGRES_USER: lowcost_europa_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EXPECTED_MAIN: 6e5031598f2c7043489d5e680b73b3c16706bd0e

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 6e5031598f2c7043489d5e680b73b3c16706bd0e
          path: main-src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main-src/requirements/development.txt

      - name: Install dependencies
        working-directory: main-src
        run: pip install -r requirements/development.txt

      - name: Exact baseline
        working-directory: main-src
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "LATEST_MAIN=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          echo "WORKTREE=CLEAN"

      - name: Repository checks
        working-directory: main-src
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          echo "DJANGO_CHECK=PASS"

          DJANGO_SETTINGS_MODULE=config.settings.production           DJANGO_SECRET_KEY=ci-deploy-check-only-key-0123456789-abcdefghijklmnopqrstuvwxyz           DJANGO_ALLOWED_HOSTS=example.test           DJANGO_CSRF_TRUSTED_ORIGINS=https://example.test           DJANGO_SECURE_SSL_REDIRECT=true           DJANGO_SECURE_HSTS_SECONDS=3600           DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=true           DJANGO_SECURE_HSTS_PRELOAD=true           python manage.py check --deploy
          echo "DEPLOY_CHECK=PASS"

          python manage.py makemigrations --check --dry-run
          echo "MIGRATION_DRIFT=PASS"
          echo "NEW_MIGRATIONS=0"

          ruff check .
          echo "RUFF=PASS"

          git diff --check
          echo "GIT_DIFF_CHECK=PASS"

      - name: Migration plan
        working-directory: main-src
        shell: bash
        run: |
          set -euo pipefail
          python manage.py migrate --noinput >/dev/null
          PLAN="$(python manage.py migrate --plan)"
          printf '%s\n' "$PLAN"
          printf '%s\n' "$PLAN" | grep -q "No planned migration operations"
          echo "MIGRATE_PLAN=PASS"

      - name: Focused constitution tests
        working-directory: main-src
        shell: bash
        run: |
          set -euo pipefail
          python manage.py test             apps.storefront.tests.test_public_eligibility             apps.catalog.tests.test_owner_panel             apps.catalog.tests.test_offer_maintenance             apps.catalog.tests.test_candidate_approval             apps.catalog.tests.test_catalog_maintenance_command             apps.catalog.tests.test_catalog_maintenance_systemd             apps.integrations.tests.test_aliexpress_safety             --verbosity 1
          echo "FOCUSED_CONSTITUTION_TESTS=PASS"

      - name: Static constitutional audit
        working-directory: main-src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from apps.catalog.services.public_eligibility import (
              ALLOWED_SHIP_FROM_COUNTRIES,
              MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY,
          )

          assert ALLOWED_SHIP_FROM_COUNTRIES == frozenset({"PL", "CZ", "FR", "ES", "DE"})
          assert MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY == 20

          approval = Path("apps/catalog/services/candidate_approval.py").read_text()
          editorial = Path("apps/catalog/services/owner_editorial.py").read_text()
          discovery = Path("apps/catalog/services/candidate_discovery.py").read_text()
          eligibility = Path("apps/catalog/services/public_eligibility.py").read_text()
          maintenance = Path("apps/catalog/services/offer_maintenance.py").read_text()
          command = Path("apps/catalog/management/commands/maintain_catalog_offers.py").read_text()
          exceptions = Path("apps/integrations/aliexpress/exceptions.py").read_text()

          assert "generate_affiliate_link" in approval
          assert '"owner_hidden": True' in approval
          assert "generate_affiliate_link" not in editorial
          assert "MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY" in editorial
          assert 'country="PT"' in discovery
          assert '"PT", "EUR"' in discovery
          assert "ship_from_country" not in discovery
          assert "protocol_verified_at__lte" in eligibility
          assert "protocol_verified_at__gte" not in eligibility
          assert "AliExpressRuntimeStateError" in exceptions
          assert "except AliExpressRuntimeStateError:" in maintenance
          assert 'raise CommandError("AliExpress runtime state failure")' in command

          print("CAP20=PASS")
          print("AUTO_APPROVAL=NO")
          print("AUTO_PUBLICATION=NO")
          print("APPROVAL_PUBLISH_SEPARATION=PASS")
          print("APPROVAL_FRESH_AFFILIATE_LINK=PASS")
          print("PUBLISH_MANUFACTURES_AFFILIATE_LINK=NO")
          print("OWNER_HIDDEN_BYPASS=NO")
          print("SHIPPING_CONSTITUTION=PASS")
          print("FALSE_GREEN_CODE_REGRESSION=PASS")

          patterns = (
              "CATALOG_PROTOCOL_FRESHNESS_DAYS",
              "protocol_verification_max_age",
              "is_protocol_verification_fresh",
              "is_ship_from_verification_fresh",
              "protocol_verified_at__gte",
          )
          active_hits = []
          all_hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix not in {".py", ".md", ".txt", ".yml", ".yaml", ".toml", ".html", ".sh"}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for pattern in patterns:
                      if pattern in line:
                          hit = (str(path), lineno, pattern, line.strip())
                          all_hits.append(hit)
                          if "tests" not in path.parts and "docs" not in path.parts:
                              active_hits.append(hit)
          for hit in all_hits:
              print("AGE_SEARCH_HIT=" + ":".join(map(str, hit)))
          print(f"ACTIVE_7_DAY_GATES={len(active_hits)}")
          assert len(active_hits) == 0
          PY

      - name: Full test suite
        working-directory: main-src
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --verbosity 1 2>&1 | tee /tmp/phase5-full-tests.log
          COUNT="$(grep -Eo 'Ran [0-9]+ tests' /tmp/phase5-full-tests.log | tail -1 | awk '{print $2}')"
          test -n "$COUNT"
          echo "FULL_TEST_COUNT=$COUNT"
          echo "FULL_TESTS=PASS"
