name: Self-hosted Runner Smoke

on:
  push:
    branches:
      - "ops/self-hosted-runner-bootstrap-001"
    paths:
      - ".github/workflows/self-hosted-runner-smoke.yml"
      - "ops/bootstrap_self_hosted_runner.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/self-hosted-runner-smoke.yml"
      - "ops/bootstrap_self_hosted_runner.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: VPS self-hosted runner smoke
    runs-on: [self-hosted, linux, x64, martaxi-vps]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify runner identity and capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "SELF_HOSTED_RUNNER=PASS"
          echo "HOSTNAME=$(hostname)"
          echo "KERNEL=$(uname -sr)"
          echo "ARCH=$(uname -m)"
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "CPU_COUNT=$(getconf _NPROCESSORS_ONLN)"
          df -h /
          free -h || true
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test -w "${RUNNER_TEMP}"

      - name: Confirm repository checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f PROJECT_CONSTITUTION.md
          test -f PROJECT_STATE.md
          echo "REPOSITORY_CHECKOUT=PASS"
