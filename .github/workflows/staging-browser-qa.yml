name: Staging browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-browser-qa.yml'
      - 'tests/browser/staging-browser-smoke.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-browser-qa
  cancel-in-progress: true

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Public staging desktop and mobile-emulated QA
        run: node tests/browser/staging-browser-smoke.cjs
      - name: Preserve screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowcost-staging-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
