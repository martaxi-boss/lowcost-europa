name: Disable Desktop Commander

on:
  push:
    branches:
      - "ops/self-hosted-runner-bootstrap-001"
    paths:
      - ".github/workflows/vps-disable-desktop-commander.yml"

permissions:
  contents: read

jobs:
  disable:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Stop and disable Desktop Commander
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="desktop-commander-remote.service"

          echo "BEFORE_ACTIVE=$(systemctl is-active "$SERVICE" || true)"
          echo "BEFORE_ENABLED=$(systemctl is-enabled "$SERVICE" || true)"

          sudo -n systemctl disable --now "$SERVICE"

          ACTIVE="$(systemctl is-active "$SERVICE" || true)"
          ENABLED="$(systemctl is-enabled "$SERVICE" || true)"

          echo "AFTER_ACTIVE=$ACTIVE"
          echo "AFTER_ENABLED=$ENABLED"

          test "$ACTIVE" = "inactive"
          test "$ENABLED" = "disabled"

          if ps -eo args | grep -F '@wonderwhy-er/desktop-commander' | grep -v grep >/dev/null; then
            echo "DC_PROCESS_REMAINS"
            ps -eo pid,user,comm,args | grep -F '@wonderwhy-er/desktop-commander' | grep -v grep
            exit 1
          fi

          echo "DESKTOP_COMMANDER_DISABLED=PASS"
