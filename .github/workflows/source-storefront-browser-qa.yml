name: Source storefront browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-storefront-browser-qa.yml'
      - 'apps/storefront/templates/**'
      - 'apps/storefront/static/**'
      - 'tests/browser/source-storefront-qa.cjs'
      - 'tests/browser/seed-source-storefront-qa.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-storefront-browser-qa.yml'
      - 'apps/storefront/templates/**'
      - 'apps/storefront/static/**'
      - 'tests/browser/source-storefront-qa.cjs'
      - 'tests/browser/seed-source-storefront-qa.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-storefront-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lowcost_europa_ci
          POSTGRES_USER: lowcost_europa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lowcost_europa_ci -d lowcost_europa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: synthetic-browser-ci-key
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lowcost_europa_ci
      POSTGRES_USER: lowcost_europa_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Install runtime
        run: pip install -r requirements/base.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright Chromium on disposable runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare synthetic database
        run: |
          python manage.py migrate --noinput
          python tests/browser/seed-source-storefront-qa.py
      - name: Start branch-local Django for browser tests
        run: |
          python manage.py runserver 127.0.0.1:8787 --noreload > qa-server.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/ > /dev/null
      - name: Test live browser layout and controls at four widths
        run: node tests/browser/source-storefront-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-storefront-browser-qa
          path: |
            qa-artifacts/source-browser/
            qa-server.log
          if-no-files-found: warn
          retention-days: 7
