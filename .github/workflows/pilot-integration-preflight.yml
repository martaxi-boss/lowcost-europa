name: Pilot integration preflight

on:
  push:
    branches:
      - 'builder/pilot-integration-preflight-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout combined pilot branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check Django application source (no database or network calls)
        run: python -m compileall -q apps config
      - name: Configure Node for image QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check apps/storefront/static/storefront/product-images.js
      - name: Image loading regression tests
        run: node --test tests/js/product-images.test.cjs
