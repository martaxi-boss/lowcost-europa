# STEP 1 ONLY — temporary HTTP challenge vhost for lowcost-europa.eu.
# Safe before the certificate exists. Activate exclusively after readback/backup.
# Do not enable together with lowcost-europa.eu.conf (same port-80 host).
server {
    listen 80;
    listen [::]:80;
    server_name lowcost-europa.eu www.lowcost-europa.eu;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Until certificate issuance, keep the working DuckDNS site available.
    location / {
        return 302 https://lowcost-europa.duckdns.org$request_uri;
    }
}
