server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lowcost-europa.165-22-114-67.sslip.io;
    root /var/www/lowcost-europa;
    index index.html index.php;

    ssl_certificate /etc/letsencrypt/live/lowcost-europa.165-22-114-67.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lowcost-europa.165-22-114-67.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /aliexpress/callback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/lowcost-europa/aliexpress/callback.php;
        fastcgi_param SCRIPT_NAME /aliexpress/callback.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /static/ {
        alias /srv/lowcost-europa/staticfiles/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }
}

