server {
    server_name lowcost-europa.165-22-114-67.sslip.io;
    root /var/www/lowcost-europa;
    index index.html index.php;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /aliexpress/callback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/lowcost-europa/aliexpress/callback.php;
        fastcgi_param SCRIPT_NAME /aliexpress/callback.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /static/ {
        alias /srv/lowcost-europa/staticfiles/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lowcost-europa.165-22-114-67.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lowcost-europa.165-22-114-67.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = lowcost-europa.165-22-114-67.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lowcost-europa.165-22-114-67.sslip.io;
    return 404; # managed by Certbot
}
