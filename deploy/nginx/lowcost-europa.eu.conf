# PRODUCTION CANONICAL VHOST — HTTPS certificate already issued and verified.
# Canonical public hostname: www.lowcost-europa.eu. Apex redirects to www.
# Keep both SAN names and the ACME challenge route during certificate renewal.
# Retired test domains are not part of this canonical config.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lowcost-europa.eu;
    server_tokens off;
    root /srv/projects/lowcost-europa/www;
    # Nginx-managed access log dedicated to this host (default system rotation).
    # The private report keeps only aggregated search-engine referrers.
    access_log /var/log/nginx/lowcost-europa.access.log combined;

    ssl_certificate /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lowcost-europa.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Django controls indexing per response and keeps operational routes private.

    # Preserve the existing AliExpress authorized callback when moving domains.
    location = /aliexpress/callback {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/projects/lowcost-europa/www/aliexpress/callback.php;
        fastcgi_param SCRIPT_NAME /aliexpress/callback.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Public engine ownership proof only; absent files fail closed.
    # Provision proof privately; never commit verification values.
    location ~ "^/yandex_[0-9a-f]{16}\\.html$" {
        default_type text/html;
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        limit_except GET { deny all; }
    }

    location /static/ {
        alias /srv/projects/lowcost-europa/staticfiles/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lowcost-europa.eu;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lowcost-europa.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 https://www.lowcost-europa.eu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lowcost-europa.eu www.lowcost-europa.eu;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.lowcost-europa.eu$request_uri;
    }
}
