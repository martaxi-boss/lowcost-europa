<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{% block title %}Área privada | Lowcost Europa{% endblock %}</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f3;color:#171817;overflow-x:hidden}.owner-wrap{width:min(100%,920px);margin:auto;padding:14px}.owner-top{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto}.owner-top a,.owner-top button{color:#fff;background:transparent;border:1px solid #666;border-radius:9px;padding:10px 12px;min-height:44px;white-space:nowrap;text-decoration:none;font:inherit}.owner-top form{margin:0}.brand{font-weight:800;margin-right:auto;white-space:nowrap}.card{display:block;background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0;color:inherit;text-decoration:none;box-shadow:0 1px 4px #0000000a}.card h2,.card h3{margin-top:0}.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.count{background:#f7f7f7;border-radius:10px;padding:10px;overflow-wrap:anywhere}.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.tabs a{border:1px solid #bbb;border-radius:999px;padding:10px 12px;text-decoration:none;color:#111;white-space:nowrap;min-height:44px}.tabs a.active{font-weight:800;border-color:#111}.product{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:14px 0;overflow:hidden}.product img{width:100%;max-height:340px;object-fit:contain;background:#fafafa;border-radius:12px}.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0}.facts div{background:#f7f7f7;padding:9px;border-radius:9px;overflow-wrap:anywhere}.actions{display:grid;gap:10px}.actions form{border:1px solid #ddd;border-radius:12px;padding:10px}.move-family-form select{display:block;width:100%;max-width:100%;min-height:50px;margin-top:8px;border:1px solid #999;border-radius:10px;padding:10px;font-size:16px}.button,.actions button,.real{width:100%;min-height:50px;border-radius:10px;border:1px solid #444;background:#fff;font-size:16px;font-weight:700;padding:10px;text-decoration:none;color:#111;display:flex;align-items:center;justify-content:center;text-align:center}.danger{border-color:#8b2525!important;background:#fff5f5!important}.success{border-color:#276d37!important;background:#f0fff2!important}.choice{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:10px;padding:10px;margin:7px 0;min-height:50px}.choice input{width:22px;height:22px;flex:0 0 22px}.message{padding:12px;border-radius:10px;margin:12px 0}.error{background:#fff0f0;border:1px solid #a33}.notice{background:#effbef;border:1px solid #39743f}.state{font-weight:800}.empty{padding:28px;text-align:center;background:#fff;border-radius:14px}.login-shell{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card{width:min(100%,420px);background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px}.login-card h1{font-size:1.3rem;margin-bottom:4px}.login-card label{display:block;font-weight:700;margin:20px 0 8px}.login-card input{width:100%;min-height:52px;border:1px solid #999;border-radius:10px;padding:10px;font-size:18px}.login-card button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;font-size:16px}@media(min-width:700px){.counts{grid-template-columns:repeat(3,minmax(0,1fr))}.product{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.product img{grid-row:1/8}.product .actions{grid-column:2}}
</style></head><body>{% block body %}{% endblock %}</body></html>
